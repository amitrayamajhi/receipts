<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- iPhone: run full-screen from the Home Screen like a native app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Receipts" />
  <title>Receipt Tracker</title>

  <!-- Vendored libraries (all local, work fully offline) -->
  <script src="vendor/tesseract.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🧾</span>
      <span>Receipt Tracker</span>
    </div>
    <div class="month-picker">
      <button id="monthPrev" class="icon-btn" aria-label="Previous month">‹</button>
      <input id="monthInput" type="month" />
      <button id="monthNext" class="icon-btn" aria-label="Next month">›</button>
    </div>
  </header>

  <main id="view" class="view"><!-- active screen renders here --></main>

  <nav class="tabbar" role="navigation">
    <button class="tab" data-route="scan"><span>📷</span><label>Scan</label></button>
    <button class="tab" data-route="log"><span>📋</span><label>Log</label></button>
    <button class="tab" data-route="dashboard"><span>📊</span><label>Dashboard</label></button>
    <button class="tab" data-route="budgets"><span>🎯</span><label>Budgets</label></button>
    <button class="tab" data-route="settings"><span>⚙️</span><label>Settings</label></button>
  </nav>

  <!-- Toast container -->
  <div id="toast" class="toast" hidden></div>

  <!-- Guard: this app must be opened through the local server, not by double-
       clicking index.html. On file:// the modules/OCR/service-worker are all
       blocked by the browser and every button silently does nothing. This runs
       as a classic script (no module), so it works even when modules are blocked. -->
  <script>
    if (location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", function () {
        document.body.innerHTML =
          '<div style="max-width:520px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#14202b">' +
          '<div style="font-size:3rem">🧾</div>' +
          '<h1 style="margin:.3em 0">Please start the app the right way</h1>' +
          '<p style="font-size:1.05rem;line-height:1.6">You opened <code>index.html</code> directly, so your browser is blocking the camera, scanning and everything else.</p>' +
          '<p style="font-size:1.05rem;line-height:1.6"><b>Close this tab</b>, then in the app folder start it with:</p>' +
          '<p style="font-size:1.2rem;background:#0f766e;color:#fff;padding:12px 16px;border-radius:10px;text-align:center">▶ Start Receipt Tracker.bat</p>' +
          '<p style="color:#64748b">On Mac or Linux, run <code>./start.sh</code> in a terminal instead.</p>' +
          '<p style="color:#64748b">It opens the app at <code>http://localhost:8770/</code> — that address must show in the bar for the app to work.</p>' +
          '</div>';
      });
    }
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
